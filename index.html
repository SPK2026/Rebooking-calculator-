<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airline Date Change & Fare Difference Calculator</title>
  <style>
    :root {
      --primary: #0066cc;
      --bg: #f4f7f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.4rem;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 10px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0052a3;
    }

    .results {
      margin-top: 25px;
      background-color: var(--bg);
      padding: 15px;
      border-radius: 8px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .result-row.total {
      font-weight: bold;
      font-size: 1.1rem;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h2>✈️ Date Change Calculator</h2>

    <div class="input-group">
      <label for="currency">Select Currency</label>
      <select id="currency">
        <option value="$">USD - US Dollar ($)</option>
        <option value="€">EUR - Euro (€)</option>
        <option value="£">GBP - British Pound
